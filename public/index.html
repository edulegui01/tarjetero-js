<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tarjetero</title>
<style>
  /* Poppins servida desde este mismo servidor (public/fonts), no desde
     Google Fonts: el tótem corre en modo kiosco y no depende de que el
     tablet tenga internet para mostrar los mensajes con la tipografía de
     la marca (la misma del "Resto Café" del logo). */
  @font-face {
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/poppins-400-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/poppins-400-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/poppins-700-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Poppins';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/poppins-700-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Poppins', system-ui, sans-serif;
    background: #111827;
    color: #f9fafb;
    transition: background-color 0.2s ease;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  body.success { background: #166534; }
  body.failure { background: #991b1b; }
  body.connectionError { background: #9a3412; }

  #message {
    font-size: 3rem;
    font-weight: 700;
    padding: 2rem;
    max-width: 90vw;
  }
  #waiting {
    font-size: 1.5rem;
    opacity: 0.7;
  }

  #carousel {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #fff;
  }
  #carousel.hidden { display: none; }
  #carousel img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #carousel img.active { opacity: 1; }

  #message.hidden { display: none; }

  #unlock {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    font-size: 2rem;
    font-weight: 600;
    text-align: center;
    padding: 2rem;
    cursor: pointer;
    z-index: 10;
  }
  #unlock.hidden { display: none; }
</style>
</head>
<body id="body">
  <div id="unlock">Tocá la pantalla para activar el sonido</div>

  <div id="carousel" class="hidden"></div>

  <div id="message">
    <div id="waiting">Esperando lectura de tarjeta…</div>
  </div>

<script>
  const body = document.getElementById('body');
  const message = document.getElementById('message');
  const unlock = document.getElementById('unlock');
  const carousel = document.getElementById('carousel');

  // Carrusel de imágenes configurado desde /admin, mostrado en vez del
  // texto "Esperando lectura de tarjeta…" cuando hay imágenes cargadas.
  let carouselTimer = null;
  let carouselIndex = 0;

  function startCarousel(images, intervalSeconds) {
    carousel.innerHTML = '';
    images.forEach((url, i) => {
      const img = document.createElement('img');
      img.src = url;
      if (i === 0) img.classList.add('active');
      carousel.appendChild(img);
    });

    const imgs = carousel.querySelectorAll('img');
    carouselTimer = setInterval(() => {
      imgs[carouselIndex].classList.remove('active');
      carouselIndex = (carouselIndex + 1) % imgs.length;
      imgs[carouselIndex].classList.add('active');
    }, Math.max(1, intervalSeconds) * 1000);
  }

  fetch('/carousel-images')
    .then((res) => res.json())
    .then(({ images, intervalSeconds }) => {
      if (images && images.length > 0) {
        startCarousel(images, intervalSeconds);
        render(lastState);
      }
    })
    .catch(() => {});

  // Antes acá había voz: el tótem leía el mensaje con TTS (puente nativo
  // `window.AndroidTts` en el kiosco, speechSynthesis en el navegador). El
  // local pidió que no hable -- solo un pitido, y solo cuando la tarjeta se
  // rechaza. El puente sigue existiendo en la app pero ya no se usa desde
  // acá, así que sacar la voz no obligó a recompilar el APK.
  //
  // El pitido se genera con Web Audio en vez de reproducir un archivo: no
  // hay un asset más que pueda faltar en el tablet (mismo criterio que las
  // fuentes locales) y tono/duración se ajustan acá nomás.
  const BEEP_HZ = 1400;
  const BEEP_MS = 200;

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }

  function beep() {
    const ctx = getAudioCtx();
    if (!ctx || ctx.state !== 'running') return;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = 'square';
    oscillator.frequency.value = BEEP_HZ;
    // Cortar el oscilador de golpe suena como un "click" en el parlante del
    // tablet; una rampa corta de apagado lo evita.
    const fin = ctx.currentTime + BEEP_MS / 1000;
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.setTargetAtTime(0, fin, 0.015);
    oscillator.connect(gain).connect(ctx.destination);
    oscillator.start();
    oscillator.stop(fin + 0.1);
  }

  // En el kiosco el audio arranca habilitado: la app pone
  // mediaPlaybackRequiresUserGesture=false (ver MainActivity), así que el
  // AudioContext queda en 'running' sin que nadie toque nada. Un navegador
  // de escritorio lo deja 'suspended' hasta que haya un gesto del usuario, y
  // recién ahí tiene sentido mostrar el cartel para desbloquearlo -- si se
  // mostrara en el tablet taparía el carrusel a pantalla completa.
  function refreshUnlockOverlay() {
    const ctx = getAudioCtx();
    unlock.classList.toggle('hidden', !ctx || ctx.state === 'running');
  }

  unlock.addEventListener('click', () => {
    const ctx = getAudioCtx();
    if (ctx) ctx.resume().then(beep, () => {});
    unlock.classList.add('hidden');
  });

  const ctxInicial = getAudioCtx();
  if (ctxInicial && ctxInicial.state === 'suspended') {
    ctxInicial.resume().then(refreshUnlockOverlay, refreshUnlockOverlay);
  }
  refreshUnlockOverlay();

  let lastState = { status: 'waiting' };

  function render(state) {
    lastState = state;
    body.className = state.status === 'waiting' ? '' : state.status;
    const hasCarousel = carousel.childElementCount > 0;

    if (state.status === 'waiting') {
      carousel.classList.toggle('hidden', !hasCarousel);
      message.classList.toggle('hidden', hasCarousel);
      message.innerHTML = '<div id="waiting">Esperando lectura de tarjeta…</div>';
      return;
    }

    carousel.classList.add('hidden');
    message.classList.remove('hidden');
    message.textContent = state.message || '';
    // Solo en el rechazo. Las dos rutas de denegación pitan: 'failure' (deuda)
    // y 'connectionError' (falló la consulta a TSM), porque en las dos la
    // persona queda sin poder salir. Una salida autorizada no suena.
    if (state.status === 'failure' || state.status === 'connectionError') {
      beep();
    }
  }

  const source = new EventSource('/events');
  source.onmessage = (event) => render(JSON.parse(event.data));
</script>
</body>
</html>
